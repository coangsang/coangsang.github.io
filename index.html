<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">

  <!-- Bắt buộc để hiển thị đúng trên mobile -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Who is Coangsang?</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Handjet:wght,ELSH@100..900,2&display=swap"
    rel="stylesheet"
  >

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      background: #000;
      color-scheme: dark;
    }

    body {
      min-height: 100svh;
      margin: 0;

      padding-top: max(1.25rem, env(safe-area-inset-top));
      padding-right: max(1.25rem, env(safe-area-inset-right));
      padding-bottom: max(1.25rem, env(safe-area-inset-bottom));
      padding-left: max(1.25rem, env(safe-area-inset-left));

      background: #000;
      color: #d0f5d0;

      font-family: "Handjet", monospace;
      font-size: clamp(1.15rem, 4.8vw, 1.5rem);
      line-height: 1.35;

      text-shadow: 0 0 2px #00ff00;
      filter: contrast(1.2) saturate(1.3);

      overflow-x: hidden;
    }

    main {
      width: min(100%, 48rem);
      margin-inline: auto;
    }

    p {
      margin: 0 0 0.75rem;
      overflow-wrap: anywhere;
    }

    a {
      color: #32cd32;
      text-shadow: none;
      text-underline-offset: 0.15em;
      overflow-wrap: anywhere;
    }

    a:hover,
    a:focus-visible {
      color: #7cff7c;
    }

    .crt-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;

      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.15) 0,
        rgba(0, 0, 0, 0.15) 1px,
        transparent 2px,
        transparent 3px
      );

      box-shadow: inset 0 0 clamp(40px, 15vw, 100px)
        rgba(0, 0, 0, 0.5);
    }

    .crt-overlay::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.03);
      animation: flicker 0.15s infinite;
    }

    @keyframes flicker {
      0%,
      19%,
      21%,
      23%,
      25%,
      54%,
      56%,
      100% {
        opacity: 0.02;
      }

      20%,
      24%,
      55% {
        opacity: 0.05;
      }
    }

    /* Giảm hiệu ứng cho người dùng tắt animation */
    @media (prefers-reduced-motion: reduce) {
      .crt-overlay::after {
        animation: none;
      }
    }

    /* Tối ưu màn hình rất nhỏ */
    @media (max-width: 360px) {
      body {
        padding-inline: 1rem;
        font-size: 1.1rem;
      }

      p {
        margin-bottom: 0.6rem;
      }
    }
  </style>
</head>

<body>
  <main>
    <p>*full name Quang Sang Pham</p>
    <p>*dob 19/06/2006</p>
    <p>*hometown Huong Son, Ha Tinh</p>
    <p>*current location Ho Chi Minh City</p>

    <p>
      *email
      <a href="mailto:coangsang19@gmail.com">
        coangsang19@gmail.com
      </a>
    </p>

<p>

  </a>
</p>

<p>

    <ruby>
      <rb>instagram.com/coang.sang</rb>
      <rt>@coang.sang</rt>
    </ruby>
  </a>
</p>

    <p>*hobbies reading books, walking, doing nothing (literally)</p>
  </main>

  <div class="crt-overlay" aria-hidden="true"></div>
</body>
</html>
